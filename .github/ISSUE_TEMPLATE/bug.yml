name: Website problem
description: Report a problem with this public community website or its contribution links
title: "Website bug: "
body:
  - type: markdown
    attributes:
      value: |
        Only report issues with the **public community website**, not the private family app. This issue is public. Do not include secrets, personal information, private media, or security vulnerability details.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce (optional)
